# Pushing a tag such as v1.0.0 builds the downloads and puts them into a draft release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Check that the tag is the version in gradle.properties
        run: grep -qx "projectVersion=$GITHUB_REF_NAME" gradle.properties
      - name: Test and build
        run: ./gradlew core:test lwjgl3:jar lwjgl3:packageWinX64
      - name: Name the downloads
        run: |
          mkdir downloads
          cp lwjgl3/build/libs/*.jar "downloads/mbus-$GITHUB_REF_NAME.jar"
          cp lwjgl3/build/construo/dist/*winX64.zip "downloads/mbus-$GITHUB_REF_NAME-winX64.zip"
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes downloads/*
