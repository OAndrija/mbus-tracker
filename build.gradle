allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  idea {
    module {
      outputDir file('build/classes/java/main')
      testOutputDir file('build/classes/java/test')
    }
  }
}

subprojects {
  apply plugin: 'java-library'

  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    File assetsFolder = new File("${project.rootDir}/assets/")
    File assetsFile = new File(assetsFolder, "assets.txt")
    assetsFile.delete()
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
  }

  version = "$projectVersion"
  ext.appName = 'MBus'
  repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url 'https://jitpack.io' }
  }
}

eclipse.project.name = 'MBus' + '-parent'

tasks.register('updateTimetable') {
  group = 'mbus'
  description = 'Downloads the current Marprom timetable into the assets.'
  doLast {
    def source = 'https://gitlab.com/api/v4/projects/derp-si%2Fgtfs-generators/packages/generic/marprom_official/latest/marprom_gtfs.zip'
    def target = file('assets/data/marprom_gtfs.zip')
    def download = File.createTempFile('marprom_gtfs', '.zip')
    try {
      new URL(source).withInputStream { input -> download.withOutputStream { it << input } }
      // Replace the bundled timetable only with something that is one.
      def names = []
      new java.util.zip.ZipFile(download).withCloseable { zip -> zip.entries().each { names << it.name } }
      def missing = ['stops.txt', 'routes.txt', 'trips.txt', 'stop_times.txt', 'shapes.txt', 'calendar.txt'] - names
      if (missing) throw new GradleException("The download is not a complete timetable, missing: $missing")
      target.bytes = download.bytes
      logger.quiet("Updated ${target.name} (${target.length()} bytes). Run the tests before you release it.")
    } finally {
      download.delete()
    }
  }
}
